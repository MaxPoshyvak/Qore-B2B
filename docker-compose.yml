version: '3.8'

services:
    db:
        image: postgres:16
        restart: unless-stopped
        environment:
            POSTGRES_USER: admin
            POSTGRES_PASSWORD: ${DB_PASSWORD} # Пароль береться з файлу .env у корені
            POSTGRES_DB: my_database
        volumes:
            - db-data:/var/lib/postgresql/data
        expose:
            - '5432'

    api:
        build:
            context: . # 👑 МАГІЯ: Віддаємо Докеру ВЕСЬ монорепозиторій
            dockerfile: ./apps/backend/Dockerfile # Але інструкцію беремо саме для бекенду
        restart: unless-stopped
        ports:
            - '4000:4000'
        depends_on:
            - db
        environment:
            DATABASE_URL: postgres://admin:${DB_PASSWORD}@db:5432/my_database
            PORT: 4000

    web:
        build:
            context: .
            dockerfile: ./apps/frontend/Dockerfile
        restart: unless-stopped
        ports:
            - '3000:3000'
        depends_on:
            - api
        environment:
            # Важливо: браузер клієнта має стукати на localhost, а не на ім'я контейнера!
            NEXT_PUBLIC_API_URL: http://localhost:4000/api
            DATABASE_URL: postgres://admin:${DB_PASSWORD}@db:5432/my_database

volumes:
    db-data:
