<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="auto">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="480" rx="16" fill="url(#bg)"/>
  <rect width="1198" height="478" x="1" y="1" rx="15" fill="none" stroke="#FFFFFF" stroke-opacity="0.1"/>

  <!-- Ambient Glow Behind Logo -->
  <circle cx="600" cy="180" r="140" fill="#3B82F6" opacity="0.15" filter="url(#glow)"/>

  <!-- Monolith Emblem Icon (Center, scaled up) -->
  <g transform="translate(560, 90) scale(2.5)">
    <rect width="32" height="32" rx="8" fill="#09090B"/>
    <rect width="31" height="31" x="0.5" y="0.5" rx="7.5" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <path d="M16 7C11.03 7 7 11.03 7 16C7 20.97 11.03 25 16 25C18.15 25 20.13 24.24 21.68 22.98L23.29 24.59C23.68 24.98 24.32 24.98 24.71 24.59C25.1 24.2 25.1 23.56 24.71 23.17L23.01 21.47C24.25 19.91 25 18.04 25 16C25 11.03 20.97 7 16 7ZM16 10C19.31 10 22 12.69 22 16C22 19.31 19.31 22 16 22C12.69 22 10 19.31 10 16C10 12.69 12.69 10 16 10Z" fill="#3B82F6"/>
    <circle cx="16" cy="16" r="4.2" fill="#60A5FA" opacity="0.4"/>
    <circle cx="16" cy="16" r="2.8" fill="#60A5FA"/>
    <circle cx="16" cy="16" r="1.3" fill="#FFFFFF"/>
  </g>

  <!-- Typography -->
  <text x="600" y="235" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="-0.03em">
    Qore
  </text>
  <text x="600" y="275" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" fill="#94A3B8" letter-spacing="-0.01em">
    The Modern Operating System for High-Performing Restaurants
  </text>

  <!-- Pills / Highlights -->
  <g transform="translate(600, 340)">
    <g transform="translate(-360, 0)">
      <rect x="0" y="0" width="220" height="42" rx="21" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <circle cx="24" cy="21" r="5" fill="#10B981"/>
      <text x="38" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#E2E8F0">Live Table QR Orders</text>
    </g>
    <g transform="translate(-110, 0)">
      <rect x="0" y="0" width="220" height="42" rx="21" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <circle cx="24" cy="21" r="5" fill="#3B82F6"/>
      <text x="38" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#E2E8F0">Interactive Split-Bill</text>
    </g>
    <g transform="translate(140, 0)">
      <rect x="0" y="0" width="220" height="42" rx="21" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <circle cx="24" cy="21" r="5" fill="#8B5CF6"/>
      <text x="38" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#E2E8F0">Cost-Optimized AI</text>
    </g>
  </g>
</svg>
